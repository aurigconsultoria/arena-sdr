<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena SDR · Lux Energia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --azul:#1880B8; --ciano:#00A8D0; --indigo:#44489A;
  --bg:#F4F7FA; --card:#FFFFFF; --tx:#14202B; --tx2:#5A6B7B; --linha:#DDE5EC;
  --ok:#1E9E6A; --alerta:#D98A1C; --erro:#C8413B; --suave:#EAF3F9;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Montserrat',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0E151C;--card:#16212B;--tx:#E6EDF3;--tx2:#93A4B4;--linha:#263442;--suave:#1A2C3A}
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
header{background:linear-gradient(90deg,var(--ciano),var(--azul) 45%,var(--indigo));color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
header .eyebrow{font-family:var(--mono);font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.1em}
header .user{margin-left:auto;font-size:12px;display:flex;gap:10px;align-items:center}
header .user button{background:rgba(255,255,255,.18);border:0;color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer}
nav{display:flex;gap:4px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--linha);overflow-x:auto}
nav button{background:none;border:0;padding:12px 14px;cursor:pointer;color:var(--tx2);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav button.ativo{color:var(--azul);border-color:var(--azul)}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:10px;padding:18px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 4px}
.card .sub{color:var(--tx2);font-size:12px;margin:0 0 14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.mono{font-family:var(--mono)}
.muted{color:var(--tx2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--azul);color:#fff;border:0;border-radius:7px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--suave);color:var(--azul)}
.btn.peq{padding:4px 10px;font-size:12px}
.btn.perigo{background:var(--erro)}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--bg);border:1px solid var(--linha);border-radius:7px;padding:7px 9px;width:100%}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:12px;color:var(--tx2);margin-bottom:10px}
label>input,label>select,label>textarea{margin-top:3px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2);font-weight:600;padding:8px;border-bottom:1px solid var(--linha);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--linha);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--mono)}
.tbl{overflow-x:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:var(--suave);color:var(--azul)}
.pill.A{background:#DDF3E8;color:#157A50}.pill.B{background:#FFF1D9;color:#9A6212}.pill.C{background:#EEE;color:#666}
.pill.no_show,.pill.cancelada{background:#FBE3E1;color:#A1322D}
.pill.realizada{background:#DDF3E8;color:#157A50}
/* ranking */
.podio{display:grid;gap:10px}
.pos{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--linha);border-radius:10px;background:var(--card)}
.pos .num{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--tx2);text-align:center}
.pos.p1{border-color:var(--azul);box-shadow:0 0 0 1px var(--azul) inset}
.pos.p1 .num{color:var(--azul)}
.pos .nome{font-weight:700;font-size:15px}
.pos .pts{font-family:var(--mono);font-size:22px;font-weight:500}
.pos .pts small{font-size:11px;color:var(--tx2);margin-left:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:11px;color:var(--tx2);background:var(--suave);padding:1px 7px;border-radius:5px;font-family:var(--mono)}
.barra{height:8px;background:var(--suave);border-radius:99px;overflow:hidden;margin:4px 0 10px}
.barra i{display:block;height:100%;background:var(--azul);border-radius:99px}
.barra i.ok{background:var(--ok)}
.meta-lin{display:flex;justify-content:space-between;font-size:12px}
.kpi{font-family:var(--mono);font-size:26px;font-weight:500}
.kpi-l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2)}
.aviso{padding:10px 12px;border-radius:8px;background:var(--suave);font-size:13px;margin-bottom:12px}
.aviso.erro{background:#FBE3E1;color:#8A2A26}
.at{border-left:4px solid var(--linha);padding:8px 12px;margin-bottom:8px;background:var(--bg);border-radius:0 8px 8px 0}
.at.atencao{border-color:var(--alerta)}.at.pendencia{border-color:var(--azul)}.at.destaque{border-color:var(--ok)}.at.sistema{border-color:var(--erro)}
.at b{display:block;font-size:13px}
.at span{font-size:12px;color:var(--tx2)}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.subnav button{background:var(--card);border:1px solid var(--linha);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600;color:var(--tx2)}
.subnav button.ativo{background:var(--azul);color:#fff;border-color:var(--azul)}
.login{max-width:380px;margin:70px auto}
.oculto{display:none!important}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#14202B;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:99;max-width:90vw}
.modal-fundo{position:fixed;inset:0;background:rgba(10,20,30,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.modal{background:var(--card);border-radius:12px;padding:20px;max-width:640px;width:100%}
.legenda{font-size:12px;color:var(--tx2);line-height:1.6}
.legenda b{color:var(--tx)}
svg text{font-family:var(--mono);font-size:10px;fill:var(--tx2)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===================== CONFIG =====================
const SUPABASE_URL = "https://fctmquzdqifzkirnzykw.supabase.co";
const SUPABASE_KEY = "sb_publishable_15Ad6aVoUIQeDEbSdpzn9g_3MQSZB9y";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const QUAL = {
  A: "Quente · decisor presente, dor clara, fatura enviada ou prometida, próximo passo marcado",
  B: "Morna · interesse real, mas falta decisor, fatura ou timing (> 3 meses)",
  C: "Fria · fora do perfil (consumo/tensão), sem interesse ou só curiosidade",
};
const STATUS = { agendada:"Agendada", realizada:"Realizada", no_show:"No-show", remarcada:"Remarcada", cancelada:"Cancelada" };
const CAT = {
  ligacao:"ligações", conversa:"conversas", reuniao_agendada:"agendadas", reuniao_realizada:"realizadas",
  qualidade_A:"A", qualidade_B:"B", qualidade_C:"C", no_show:"no-show", fatura_recebida:"faturas",
  fechamento:"fechamentos", meta_ligacoes_semana:"meta lig.", meta_conectadas_semana:"meta conv.",
  meta_reunioes_semana:"meta reu.", ajuste:"ajustes"
};

// ===================== ESTADO =====================
const S = { user:null, perfil:null, aba:"arena", subAdmin:"coaching", periodo:"semana", sdrs:[], temporadas:[], ini:null, fim:null };

// ===================== UTIL =====================
const $ = (s, el=document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hojeSP = () => new Date(new Date().toLocaleString("en-US",{timeZone:"America/Sao_Paulo"}));
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmtData = (s) => s ? new Date(s).toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—";
const fmtDia = (s) => s ? s.split("-").reverse().slice(0,2).join("/") : "—";
const fmtSeg = (s) => s==null ? "—" : `${Math.floor(s/60)}m${String(Math.round(s%60)).padStart(2,"0")}s`;
const pct = (v) => v==null ? "—" : `${String(v).replace(".",",")}%`;
const n = (v) => (v ?? 0).toLocaleString("pt-BR");
function toast(msg, ms=3200){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
async function rpc(nome, args={}){ const {data,error}=await sb.rpc(nome,args); if(error){ toast(error.message); throw error; } return data; }
async function q(prom){ const {data,error}=await prom; if(error){ toast(error.message); throw error; } return data; }
const gestor = () => S.perfil?.papel === "gestor";
const nomeSdr = (id) => S.sdrs.find(s=>s.id===id)?.nome || "—";

function periodo(tipo){
  const h = hojeSP(); let ini, fim = iso(h);
  if (tipo==="semana"){ const d=new Date(h); const dw=(d.getDay()+6)%7; d.setDate(d.getDate()-dw); ini=iso(d); }
  else if (tipo==="semana_passada"){ const d=new Date(h); const dw=(d.getDay()+6)%7; d.setDate(d.getDate()-dw-7); ini=iso(d); const f=new Date(d); f.setDate(f.getDate()+6); fim=iso(f); }
  else if (tipo==="mes"){ ini = iso(new Date(h.getFullYear(), h.getMonth(), 1)); }
  else if (tipo==="mes_passado"){ ini = iso(new Date(h.getFullYear(), h.getMonth()-1, 1)); fim = iso(new Date(h.getFullYear(), h.getMonth(), 0)); }
  else if (tipo==="total"){ ini = "2024-01-01"; }
  else if (tipo.startsWith("temp:")){ const t=S.temporadas.find(x=>x.id===tipo.slice(5)); ini=t.inicio; fim=t.fim; }
  else if (tipo==="custom"){ ini=S.ini; fim=S.fim; }
  return { ini, fim };
}
function seletorPeriodo(){
  const opts = [["semana","Esta semana"],["semana_passada","Semana passada"],["mes","Este mês"],["mes_passado","Mês passado"],["total","Total"],
    ...S.temporadas.map(t=>[`temp:${t.id}`, t.nome]), ["custom","Personalizado"]];
  const p = periodo(S.periodo);
  return `<div class="row" style="margin-bottom:14px">
    <select id="selPer" style="width:auto">${opts.map(([v,l])=>`<option value="${v}" ${S.periodo===v?"selected":""}>${esc(l)}</option>`).join("")}</select>
    <span class="${S.periodo==="custom"?"":"oculto"} row"><input type="date" id="pIni" value="${p.ini||""}" style="width:auto"> <input type="date" id="pFim" value="${p.fim||""}" style="width:auto"></span>
    <span class="mono muted" style="font-size:12px">${fmtDia(p.ini)} → ${fmtDia(p.fim)}</span></div>`;
}
function ligarSeletor(){
  $("#selPer")?.addEventListener("change", e=>{ S.periodo=e.target.value; if(S.periodo==="custom"){ const p=periodo("semana"); S.ini=S.ini||p.ini; S.fim=S.fim||p.fim; } render(); });
  $("#pIni")?.addEventListener("change", e=>{ S.ini=e.target.value; render(); });
  $("#pFim")?.addEventListener("change", e=>{ S.fim=e.target.value; render(); });
}
function modal(html, onMount){
  const f=document.createElement("div"); f.className="modal-fundo"; f.innerHTML=`<div class="modal">${html}</div>`;
  f.addEventListener("click", e=>{ if(e.target===f) f.remove(); });
  document.body.appendChild(f); onMount && onMount(f, ()=>f.remove()); return f;
}

// ===================== AUTH =====================
async function iniciar(){
  const { data:{ session } } = await sb.auth.getSession();
  S.user = session?.user || null;
  sb.auth.onAuthStateChange((_e, sess)=>{ const mudou=(sess?.user?.id)!==(S.user?.id); S.user=sess?.user||null; if(mudou) carregar(); });
  carregar();
}
async function carregar(){
  if(!S.user){ return telaLogin(); }
  const { data:perfil } = await sb.from("perfis").select("*").eq("user_id", S.user.id).maybeSingle();
  S.perfil = perfil;
  if(!perfil || perfil.papel==="pendente"){
    $("#app").innerHTML = `<div class="login card"><h2>Acesso aguardando liberação</h2>
      <p class="muted">Sua conta (${esc(S.user.email)}) foi criada. Peça ao gestor para cadastrar este e-mail no time.</p>
      <button class="btn sec" id="sair">Sair</button></div>`;
    $("#sair").onclick = ()=>sb.auth.signOut(); return;
  }
  S.sdrs = await q(sb.from("sdrs").select("*").order("nome"));
  S.temporadas = await q(sb.from("temporadas").select("*").order("inicio",{ascending:false}));
  render();
}
function telaLogin(modo="entrar"){
  $("#app").innerHTML = `<div class="login card">
    <div class="eyebrow mono muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.1em">Lux Energia · Time comercial</div>
    <h2 style="font-size:22px;margin:4px 0 16px">Arena SDR</h2>
    <label>E-mail<input id="lEmail" type="email" autocomplete="email"></label>
    <label>Senha<input id="lSenha" type="password" autocomplete="${modo==="entrar"?"current-password":"new-password"}"></label>
    <div class="row"><button class="btn" id="lOk">${modo==="entrar"?"Entrar":"Criar conta"}</button>
    <button class="btn sec" id="lTroca">${modo==="entrar"?"Criar conta":"Já tenho conta"}</button></div>
    <p><a href="#" id="lEsq" class="muted" style="font-size:12px">Esqueci a senha</a></p></div>`;
  $("#lTroca").onclick = ()=>telaLogin(modo==="entrar"?"criar":"entrar");
  $("#lEsq").onclick = async (e)=>{ e.preventDefault(); const em=$("#lEmail").value.trim(); if(!em) return toast("Preencha o e-mail.");
    await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split("#")[0]}); toast("Se o e-mail existir, o link de redefinição foi enviado."); };
  $("#lOk").onclick = async ()=>{
    const email=$("#lEmail").value.trim(), password=$("#lSenha").value;
    if(modo==="entrar"){ const {error}=await sb.auth.signInWithPassword({email,password}); if(error) toast(error.message==="Invalid login credentials"?"E-mail ou senha incorretos.":error.message); }
    else { const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.href.split("#")[0]}}); if(error) return toast(error.message);
      if(!data.session) toast("Conta criada. Confirme pelo link enviado ao seu e-mail.", 6000); }
  };
}
// fluxo de redefinição de senha
sb.auth.onAuthStateChange(async (ev)=>{ if(ev==="PASSWORD_RECOVERY"){ const nova=prompt("Digite a nova senha:"); if(nova){ const {error}=await sb.auth.updateUser({password:nova}); toast(error?error.message:"Senha atualizada."); } } });

// ===================== LAYOUT =====================
function render(){
  const abas = [["arena","Arena"],["reunioes","Reuniões"],["metricas", gestor()?"Métricas":"Meus números"]];
  if(gestor()) abas.push(["admin","Admin"]);
  $("#app").innerHTML = `<header><div><div class="eyebrow">Lux Energia · Time comercial</div><h1>Arena SDR</h1></div>
    <div class="user"><span>${esc(S.perfil.nome||S.user.email)}${gestor()?" · gestor":""}</span><button id="sair">Sair</button></div></header>
    <nav>${abas.map(([k,l])=>`<button data-aba="${k}" class="${S.aba===k?"ativo":""}">${l}</button>`).join("")}</nav>
    <main id="conteudo"><p class="muted">Carregando…</p></main>`;
  $("#sair").onclick = ()=>sb.auth.signOut();
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{ S.aba=b.dataset.aba; render(); });
  ({arena:telaArena, reunioes:telaReunioes, metricas:telaMetricas, admin:telaAdmin}[S.aba] || telaArena)();
}

// ===================== ARENA =====================
async function telaArena(){
  const temp = S.temporadas.find(t => t.inicio <= iso(hojeSP()) && t.fim >= iso(hojeSP())) || S.temporadas[0];
  if(!S.periodo || S.periodo==="semana" && !S._arenaInit && temp){ S.periodo = `temp:${temp.id}`; S._arenaInit = true; }
  const p = periodo(S.periodo);
  const [rank, painel, regras] = await Promise.all([ rpc("ranking",{p_inicio:p.ini,p_fim:p.fim}), rpc("painel_time"), q(sb.from("regras_pontos").select("*").eq("ativa",true).order("ordem")) ]);
  const tempAtual = S.periodo.startsWith("temp:") ? S.temporadas.find(t=>t.id===S.periodo.slice(5)) : null;
  const diasFim = tempAtual ? Math.ceil((new Date(tempAtual.fim+"T23:59:59-03:00") - new Date())/86400000) : null;
  $("#conteudo").innerHTML = `
    ${seletorPeriodo()}
    <div class="grid g2">
      <div>
        ${tempAtual ? `<div class="card"><div class="row" style="justify-content:space-between"><div><h2>${esc(tempAtual.nome)}</h2>
          <p class="sub mono">${fmtDia(tempAtual.inicio)} → ${fmtDia(tempAtual.fim)} ${diasFim>0?`· faltam ${diasFim} dias`:diasFim>-1?"· último dia":"· encerrada"}</p></div></div>
          <div class="grid g3" style="gap:8px">
            ${[["1º",tempAtual.premio_1],["2º",tempAtual.premio_2],["3º",tempAtual.premio_3]].filter(x=>x[1]).map(([l,pr])=>`<div class="aviso" style="margin:0"><span class="mono muted">${l}</span> · <b>${esc(pr)}</b></div>`).join("")}
          </div>${tempAtual.regras?`<p class="legenda" style="margin:10px 0 0">${esc(tempAtual.regras)}</p>`:""}</div>`:""}
        <div class="podio">${rank.map((r,i)=>`<div class="pos p${i+1}"><div class="num">${i+1}º</div>
          <div><div class="nome"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${esc(r.cor)};margin-right:6px"></span>${esc(r.nome)}</div>
          <div class="chips">${Object.entries(r.detalhe||{}).filter(([,v])=>v.p!==0).sort((a,b)=>b[1].p-a[1].p).map(([k,v])=>`<span class="chip" title="${v.p} pts">${n(v.q)} ${esc(CAT[k]||k)}</span>`).join("")}</div></div>
          <div class="pts">${n(r.pontos)}<small>pts</small></div></div>`).join("") || `<p class="muted">Nenhum SDR ativo.</p>`}</div>
      </div>
      <div>
        <div class="card"><h2>Metas da semana</h2><p class="sub">Progresso de segunda até hoje. Atualiza a cada 15 min com o GoTo.</p>
          ${painel.map(p=>`<div style="margin-bottom:14px"><b>${esc(p.nome)}</b>
            ${barraMeta("Ligações",p.lig_semana,p.meta_lig)}${barraMeta("Conversas",p.conv_semana,p.meta_conv)}${barraMeta("Reuniões",p.agend_semana,p.meta_reu)}
            <div class="chips"><span class="chip">mês: ${n(p.agend_mes)} reuniões</span><span class="chip">total: ${n(p.agend_total)} reuniões</span></div></div>`).join("")}
        </div>
        <div class="card"><h2>Como pontuar</h2><p class="sub">Reunião vale muito mais que ligação — e reunião boa vale mais ainda.</p>
          <table>${regras.map(r=>`<tr><td>${esc(r.descricao)}</td><td class="n" style="color:${r.pontos<0?"var(--erro)":"inherit"}">${r.pontos>0?"+":""}${r.pontos}</td></tr>`).join("")}</table></div>
      </div>
    </div>`;
  ligarSeletor();
}
function barraMeta(rot, v, meta){
  const p = meta ? Math.min(100, Math.round(100*v/meta)) : 0;
  return `<div class="meta-lin"><span class="muted">${rot}</span><span class="mono">${n(v)}${meta?` / ${n(meta)}`:""}</span></div><div class="barra"><i class="${p>=100?"ok":""}" style="width:${p}%"></i></div>`;
}

// ===================== REUNIÕES =====================
async function telaReunioes(){
  const p = periodo(S.periodo==="semana"||S.periodo.startsWith("temp:")?S.periodo:S.periodo);
  let qy = sb.from("reunioes").select("*").gte("agendada_em", p.ini+"T00:00:00-03:00").lte("agendada_em", p.fim+"T23:59:59-03:00").order("agendada_em",{ascending:false});
  const filtroSdr = S.filtroSdr || "";
  if(filtroSdr) qy = qy.eq("sdr_id", filtroSdr);
  const lista = await q(qy);
  const podeRegistrar = gestor() || S.perfil.sdr_id;
  $("#conteudo").innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <div>${seletorPeriodo()}</div>
      ${podeRegistrar?`<button class="btn" id="nova">+ Registrar reunião agendada</button>`:""}
    </div>

  const linhas = [
    ["Ligações realizadas","ligacoes",n],["Conversas efetivas","conectadas",n],["Taxa de conexão","taxa_conexao",pct],
    ["Tempo médio de conversa","tempo_medio_conversa_s",fmtSeg],["Tempo total falando","tempo_total_conversa_s",fmtSeg],
    ["Reuniões agendadas","agendadas",n],["Agendamento / conversa","taxa_agendamento",pct],["Agendamentos a cada 100 ligações","agendamentos_por_100",v=>v==null?"—":String(v).replace(".",",")],
    ["Realizadas","realizadas",n],["No-show","no_show",n],["Comparecimento","show_rate",pct],

  $("#conteudo").innerHTML = `${seletorPeriodo()}
    <div class="card tbl"><h2>Funil por SDR</h2><p class="sub">Ligação conta a partir de 10s; conversa efetiva a partir de 60s atendida (ajustável em Admin · Regras).</p>
      <table><thead><tr><th></th>${m.map(x=>`<th class="n">${esc(x.nome)}</th>`).join("")}${m.length>1?`<th class="n">Time</th>`:""}</tr></thead>
      <tbody>${linhas.map(([rot,k,f])=>`<tr><td>${rot}</td>${m.map(x=>`<td class="n">${f(x[k])}</td>`).join("")}${m.length>1?`<td class="n muted">${totalTime(m,k,f)}</td>`:""}</tr>`).join("")}</tbody></table></div>
    <div class="grid g2">
      <div class="card"><h2>Ligações por dia</h2><p class="sub">Ligações de saída acima do tempo mínimo.</p>${grafico(serie,"ligacoes")}</div>
      <div class="card"><h2>Reuniões agendadas por dia</h2><p class="sub">&nbsp;</p>${grafico(serie,"agendadas")}</div>
    </div>
    <div class="card tbl"><h2>Taxa de agendamento</h2><p class="sub">Reuniões agendadas ÷ conversas efetivas, na semana, no mês e no acumulado.</p>
      <table><thead><tr><th>SDR</th><th class="n">Semana</th><th class="n">Mês</th><th class="n">Total</th><th class="n">Fech./agend. total</th></tr></thead>
      <tbody>${mT.map(x=>{ const s=mS.find(y=>y.sdr_id===x.sdr_id)||{}, mm=mM.find(y=>y.sdr_id===x.sdr_id)||{};
        return `<tr><td>${esc(x.nome)}</td><td class="n">${pct(s.taxa_agendamento)} <span class="muted">(${n(s.agendadas)})</span></td><td class="n">${pct(mm.taxa_agendamento)} <span class="muted">(${n(mm.agendadas)})</span></td><td class="n">${pct(x.taxa_agendamento)} <span class="muted">(${n(x.agendadas)})</span></td><td class="n">${pct(x.taxa_fechamento)}</td></tr>`; }).join("")}</tbody></table></div>`;
  ligarSeletor();
}
function totalTime(m,k,f){
  const soma = (c)=>m.reduce((a,x)=>a+Number(x[c]||0),0);
  const r = (a,b,mult=100,d=1)=> b ? Math.round(mult*a/b*10**d)/10**d : null;
  const deriv = { taxa_conexao:()=>r(soma("conectadas"),soma("ligacoes")), taxa_agendamento:()=>r(soma("agendadas"),soma("conectadas")),
    agendamentos_por_100:()=>r(soma("agendadas"),soma("ligacoes"),100,2), show_rate:()=>r(soma("realizadas"),soma("realizadas")+soma("no_show")),
    taxa_fechamento:()=>r(soma("fechamentos"),soma("agendadas")),
    tempo_medio_conversa_s:()=>soma("conectadas")?Math.round(m.reduce((a,x)=>a+Number(x.tempo_medio_conversa_s||0)*Number(x.conectadas||0),0)/soma("conectadas")):null };
  return f(deriv[k] ? deriv[k]() : soma(k));
}
function grafico(serie, campo){
  const dias = [...new Set(serie.map(s=>s.dia))].sort();
  if(!dias.length) return `<p class="muted">Sem dados.</p>`;
  const sdrs = [...new Set(serie.map(s=>s.sdr_id))];
  const max = Math.max(1, ...dias.map(d=>serie.filter(s=>s.dia===d).reduce((a,s)=>a+Number(s[campo]),0)));
  const W=560,H=180,pad=24, bw=(W-pad)/dias.length;
  let barras="";
  dias.forEach((d,i)=>{ let y=H-pad;
    sdrs.forEach(id=>{ const v=Number(serie.find(s=>s.dia===d&&s.sdr_id===id)?.[campo]||0); const h=(H-pad-8)*v/max;
      if(h>0){ y-=h; barras+=`<rect x="${pad+i*bw+2}" y="${y}" width="${Math.max(2,bw-4)}" height="${h}" fill="${esc(S.sdrs.find(s=>s.id===id)?.cor||"#1880B8")}" rx="2"><title>${esc(nomeSdr(id))} · ${fmtDia(d)}: ${v}</title></rect>`; } });
    if(dias.length<=16 || i%Math.ceil(dias.length/12)===0) barras+=`<text x="${pad+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${fmtDia(d)}</text>`; });
  const leg = sdrs.map(id=>`<span class="row" style="gap:4px;font-size:12px"><i style="width:9px;height:9px;border-radius:2px;background:${esc(S.sdrs.find(s=>s.id===id)?.cor)}"></i>${esc(nomeSdr(id))}</span>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"><text x="0" y="12">${max}</text><line x1="${pad}" x2="${W}" y1="${H-pad}" y2="${H-pad}" stroke="var(--linha)"/>${barras}</svg><div class="row" style="gap:12px">${leg}</div>`;
}

function parseCsv(txt){
  const sep = (txt.split("\n")[0].match(/;/g)||[]).length > (txt.split("\n")[0].match(/,/g)||[]).length ? ";" : ",";
  const rows=[]; let cur=[""], q=false;
  for(let i=0;i<txt.length;i++){ const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cur[cur.length-1]+='"';i++;} else q=false; } else cur[cur.length-1]+=c; }
    else if(c==='"') q=true; else if(c===sep) cur.push(""); else if(c==="\n"){ rows.push(cur); cur=[""]; } else if(c!=="\r") cur[cur.length-1]+=c; }
  if(cur.length>1||cur[0]) rows.push(cur);
  return rows;
}
function durSeg(v){ if(!v) return null; v=String(v).trim(); if(/^\d+$/.test(v)) return +v; const p=v.split(":").map(Number); if(p.some(isNaN)) return null; return p.reduce((a,x)=>a*60+x,0); }
function dataCsv(v){ if(!v) return null; v=v.trim(); let m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})[ T]?(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m) return new Date(`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}T${m[4].padStart(2,"0")}:${m[5]}:${m[6]||"00"}-03:00`).toISOString();
  const d=new Date(v); return isNaN(d)?null:d.toISOString(); }
async function importarCsv(file){
  if(!file) return; const rows=parseCsv(await file.text()); if(rows.length<2) return toast("CSV vazio.");
  const cab=rows[0], campos=[["inicio","Data/hora da ligação"],["dono","Usuário / ramal do SDR"],["direcao","Direção (entrada/saída)"],["duracao","Duração total"],["conversa","Duração da conversa (opcional)"],["resultado","Resultado/atendida (opcional)"],["numero","Número externo (opcional)"]];
  const palpite=(k)=>{ const re={inicio:/data|date|hora|time|start/i,dono:/usu|user|ramal|ext|agent|nome|name/i,direcao:/dire|direction|tipo/i,duracao:/dura|length/i,conversa:/talk|conversa|falad/i,resultado:/result|status|atend|answer/i,numero:/n[uú]mero|number|phone|telefone|destino|to/i}[k];
    return cab.findIndex(c=>re.test(c)); };
  $("#csvMap").innerHTML = `<p class="muted">${rows.length-1} linhas. Confira o mapeamento das colunas:</p><div class="form">${campos.map(([k,l])=>`<label>${l}<select data-cm="${k}"><option value="-1">—</option>${cab.map((c,i)=>`<option value="${i}" ${palpite(k)===i?"selected":""}>${esc(c)}</option>`).join("")}</select></label>`).join("")}</div>
    <button class="btn" id="csvOk">Importar</button>`;
  $("#csvOk").onclick = async ()=>{
    const mp={}; document.querySelectorAll("[data-cm]").forEach(s=>mp[s.dataset.cm]=+s.value);
    if(mp.inicio<0||mp.dono<0) return toast("Data/hora e usuário são obrigatórios.");
    const g=(r,k)=> mp[k]>=0 ? r[mp[k]] : null;
    const achaSdr=(v)=>{ v=String(v||"").trim().toLowerCase(); return S.sdrs.find(s=>[s.ramal,s.goto_nome,s.nome,s.email].filter(Boolean).some(x=>String(x).toLowerCase()===v || v.includes(String(x).toLowerCase())))?.id; };
    const lote=[]; let sem=0;
    for(const r of rows.slice(1)){ const ini=dataCsv(g(r,"inicio")); if(!ini) continue; const sdr=achaSdr(g(r,"dono")); if(!sdr){sem++;continue;}
      const dir=String(g(r,"direcao")||"").toLowerCase(); const dt=durSeg(g(r,"duracao")); const conv=mp.conversa>=0?durSeg(g(r,"conversa")):null;
      const res=String(g(r,"resultado")||"").toLowerCase();
      const atendida = mp.resultado>=0 ? /atend|answer|complet|conect|connected/.test(res) && !/n[aã]o|no |missed|unanswer/.test(res) : (conv!=null ? conv>0 : null);
      const id="csv-"+btoa(unescape(encodeURIComponent(ini+"|"+sdr+"|"+(g(r,"numero")||"")+"|"+dt))).replace(/[^a-z0-9]/gi,"").slice(0,60);
      lote.push({ id, sdr_id:sdr, inicio:ini, direcao: /sa[ií]|out/.test(dir)?"OUTBOUND":/entr|in/.test(dir)?"INBOUND":"OUTBOUND", duracao_total_s:dt, duracao_conversa_s: conv ?? (atendida?dt:0), atendida, numero_externo:g(r,"numero"), origem:"csv" }); }
    for(let i=0;i<lote.length;i+=500) await q(sb.from("ligacoes").upsert(lote.slice(i,i+500),{onConflict:"id"}));
    toast(`${lote.length} ligações importadas${sem?` · ${sem} sem SDR identificado`:""}.`, 5000); $("#csvMap").innerHTML="";
  };
}

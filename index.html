<style>
:root{
  --bg:#06120C; --bg2:#0A1A12; --card:#0E2219; --card2:#12291E; --linha:rgba(111,211,155,.14); --linha2:rgba(111,211,155,.28);
  --tx:#EAF5EE; --tx2:#94B3A2; --tx3:#5F7E6E;
  --v900:#0B3D24; --v700:#11593A; --v500:#1F8A5B; --neon:#4BE38E; --menta:#6FD39B;
  --ouro:#D4AF37; --ouro2:#F2D47A; --erro:#FF6B6B; --alerta:#F5B94A; --azul:#4FC3F7;
  --r:14px; --sombra:0 10px 30px rgba(0,0,0,.35);
  --display:'Bebas Neue',Impact,sans-serif; --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;min-height:100vh;
  background-image:radial-gradient(1200px 500px at 80% -10%,rgba(31,138,91,.25),transparent 60%),radial-gradient(900px 400px at -10% 110%,rgba(212,175,55,.08),transparent 60%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--menta)}
.oculto{display:none!important}
.mono{font-family:var(--mono)} .muted{color:var(--tx2)} .dim{color:var(--tx3)}

/* ---------- topo ---------- */
header{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(6,18,12,.78);border-bottom:1px solid var(--linha)}
.topo{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.marca{display:flex;align-items:center;gap:10px}
.marca img{width:38px;height:38px;border-radius:10px;object-fit:cover;box-shadow:0 0 0 2px var(--ouro),0 0 18px rgba(75,227,142,.35)}
.marca b{font-family:var(--display);font-size:24px;letter-spacing:.06em;line-height:1;background:linear-gradient(90deg,var(--tx),var(--ouro2));-webkit-background-clip:text;background-clip:text;color:transparent}
.marca small{display:block;font-size:10px;color:var(--ouro);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.sync{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--tx2);text-align:right;line-height:1.35;display:flex;align-items:center;gap:8px}
.live{width:8px;height:8px;border-radius:50%;background:var(--neon);box-shadow:0 0 0 0 rgba(75,227,142,.6);animation:pulso 2s infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(75,227,142,.6)}70%{box-shadow:0 0 0 9px rgba(75,227,142,0)}100%{box-shadow:0 0 0 0 rgba(75,227,142,0)}}
.eu{display:flex;align-items:center;gap:8px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#06120C;flex:none}
.sair{background:none;border:1px solid var(--linha2);color:var(--tx2);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12px}
nav.abas{max-width:1180px;margin:0 auto;padding:0 12px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.abas::-webkit-scrollbar{display:none}
nav.abas button{position:relative;background:none;border:0;padding:10px 14px 12px;cursor:pointer;color:var(--tx2);font-weight:700;font-size:13px;white-space:nowrap;letter-spacing:.02em;transition:color .2s}
nav.abas button::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,var(--neon),var(--ouro));transform:scaleX(0);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
nav.abas button.ativo{color:var(--tx)} nav.abas button.ativo::after{transform:scaleX(1)}
nav.abas .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--erro);color:#fff;font-size:10px;margin-left:5px}

main{max-width:1180px;margin:0 auto;padding:18px 16px 110px}

/* ---------- blocos ---------- */
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--linha);border-radius:var(--r);padding:18px;margin-bottom:16px;position:relative;overflow:hidden}
.card h2{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.04em;margin:0 0 2px;line-height:1.1}
.card .sub{color:var(--tx2);font-size:12.5px;margin:0 0 14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.entra{animation:entra .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.btn{background:linear-gradient(135deg,var(--v500),var(--v700));color:#fff;border:1px solid rgba(111,211,155,.35);border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(31,138,91,.35)}
.btn:active{transform:scale(.97)}
.btn.ouro{background:linear-gradient(135deg,var(--ouro2),var(--ouro));color:#1b1405;border-color:transparent}
.btn.sec{background:transparent;color:var(--menta);border-color:var(--linha2)}
.btn.peq{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.perigo{background:transparent;color:var(--erro);border-color:rgba(255,107,107,.4)}
.btn:disabled{opacity:.5;pointer-events:none}
input,select,textarea{background:rgba(255,255,255,.04);border:1px solid var(--linha2);border-radius:10px;padding:9px 11px;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(75,227,142,.15)}
select option{background:var(--card)}
textarea{resize:vertical;min-height:70px}
input[type=date]::-webkit-calendar-picker-indicator,input[type=datetime-local]::-webkit-calendar-picker-indicator{filter:invert(.8)}
label{display:block;font-size:12px;color:var(--tx2);margin-bottom:10px;font-weight:600}
label>input,label>select,label>textarea{margin-top:4px;font-weight:400}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 14px}

/* chips clicáveis */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--linha2);background:rgba(255,255,255,.03);color:var(--tx);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;transition:all .18s;user-select:none}
.chip:hover{border-color:var(--menta)}
.chip.on{background:linear-gradient(135deg,var(--neon),var(--v500));color:#05140C;border-color:transparent;transform:scale(1.04);box-shadow:0 6px 18px rgba(75,227,142,.3)}
.chip.on.nao{background:linear-gradient(135deg,#ff8a8a,var(--erro));color:#2a0707}
.chip.on.gold{background:linear-gradient(135deg,var(--ouro2),var(--ouro));color:#1b1405}
.chip.pq{padding:6px 11px;font-size:12px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(111,211,155,.12);color:var(--menta)}
.tag.ns{background:rgba(255,107,107,.15);color:#ff9b9b}.tag.ok{background:rgba(75,227,142,.18);color:var(--neon)}
.tag.gold{background:rgba(212,175,55,.18);color:var(--ouro2)}.tag.cinza{background:rgba(255,255,255,.07);color:var(--tx2)}

/* hero bandeira */

@keyframes tremula{0%,100%{transform:scale(1.04) skewY(0deg)}50%{transform:scale(1.08) skewY(-1deg) translateX(-1%)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,18,12,.95) 0%,rgba(6,18,12,.72) 45%,rgba(6,18,12,.15) 100%)}
.hero .conteudo{position:relative;z-index:1;padding:22px;max-width:620px}
.hero h1{font-family:var(--display);font-weight:400;font-size:44px;letter-spacing:.04em;line-height:.95;margin:0}
.hero h1 span{color:var(--ouro2)}
.hero .meta{font-family:var(--mono);font-size:12px;color:var(--tx2);margin:6px 0 14px}
.premios{display:flex;gap:8px;flex-wrap:wrap}
.premio{background:rgba(6,18,12,.7);border:1px solid rgba(212,175,55,.35);border-radius:12px;padding:8px 12px;font-size:12.5px;backdrop-filter:blur(6px)}
.premio b{color:var(--ouro2);font-family:var(--display);font-size:18px;letter-spacing:.05em;margin-right:6px}
.contagem{display:flex;gap:10px;margin-top:12px}
.contagem div{background:rgba(6,18,12,.72);border:1px solid var(--linha2);border-radius:10px;padding:6px 10px;text-align:center;min-width:56px}
.contagem b{display:block;font-family:var(--display);font-size:24px;line-height:1;color:var(--neon)}
.contagem small{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em}

/* placar */
.placar{display:grid;gap:10px}
.lugar{display:grid;grid-template-columns:46px 42px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--linha);position:relative;overflow:hidden;transition:transform .2s,border-color .2s}
.lugar:hover{transform:translateX(3px);border-color:var(--linha2)}
.lugar .pos{font-family:var(--display);font-size:30px;text-align:center;color:var(--tx3);line-height:1}
.lugar.p1{border-color:rgba(212,175,55,.55);background:linear-gradient(90deg,rgba(212,175,55,.12),var(--card) 55%)}
.lugar.p1 .pos{color:var(--ouro2)}
.lugar.p1::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(242,212,122,.14) 50%,transparent 70%);transform:translateX(-100%);animation:brilho 3.8s ease-in-out infinite}
@keyframes brilho{60%,100%{transform:translateX(100%)}}
.lugar.p2 .pos{color:#C9D6CF}.lugar.p3 .pos{color:#C8875A}
.lugar .nome{font-weight:800;font-size:15px}
.lugar .barra{height:6px;border-radius:6px;background:rgba(255,255,255,.06);margin-top:6px;overflow:hidden}
.lugar .barra i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--v500),var(--neon));width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.lugar.p1 .barra i{background:linear-gradient(90deg,var(--ouro),var(--ouro2))}
.lugar .pts{font-family:var(--display);font-size:32px;line-height:1;text-align:right}
.lugar .pts small{display:block;font-family:var(--sans);font-size:10px;color:var(--tx2);letter-spacing:.1em;text-transform:uppercase}
.minis{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mini{font-size:11px;color:var(--tx2);background:rgba(255,255,255,.04);border:1px solid var(--linha);padding:1px 7px;border-radius:6px;font-family:var(--mono)}

/* anéis de meta */
.aneis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.anel{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:rgba(255,255,255,.025);border:1px solid var(--linha)}
.anel svg{flex:none}
.anel circle.fundo{stroke:rgba(255,255,255,.07)}
.anel circle.prog{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1);transform:rotate(-90deg);transform-origin:50% 50%}
.anel .t{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.anel .n{font-family:var(--display);font-size:22px;line-height:1}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--linha)}
.kpi b{display:block;font-family:var(--display);font-size:30px;line-height:1;color:var(--tx)}
.kpi span{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;font-weight:700}

/* tabelas */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);font-weight:700;padding:8px;border-bottom:1px solid var(--linha);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--linha);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--mono)}
tr:last-child td{border-bottom:0}
td input,td select{padding:6px 8px}

/* reuniões */
.reu{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--linha);margin-bottom:10px;transition:border-color .2s,transform .2s}
.reu:hover{border-color:var(--linha2)}
.reu .data{text-align:center;min-width:48px;padding:6px 4px;border-radius:10px;background:rgba(75,227,142,.08);border:1px solid var(--linha)}
.reu .data b{display:block;font-family:var(--display);font-size:24px;line-height:1}
.reu .data small{font-size:10px;text-transform:uppercase;color:var(--tx2);letter-spacing:.06em}
.reu .emp{font-weight:800;font-size:15px}
.reu .acoes{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;padding-top:8px;border-top:1px dashed var(--linha)}
.reu.pendente{border-color:rgba(245,185,74,.45);background:linear-gradient(90deg,rgba(245,185,74,.08),var(--card) 40%)}
.secao{font-family:var(--display);font-size:18px;letter-spacing:.06em;color:var(--tx2);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.secao .cont{font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.06);border-radius:6px;padding:1px 6px}

/* mural */
.post{padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--linha);margin-bottom:12px}
.post.fixo{border-color:rgba(212,175,55,.5);background:linear-gradient(180deg,rgba(212,175,55,.07),var(--card) 60%)}
.post.priv{border-style:dashed}
.post .cab{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.post .cab b{font-size:14px}
.post .cab small{color:var(--tx3);font-size:11.5px}
.post .txt{white-space:pre-wrap;word-wrap:break-word;font-size:14.5px;line-height:1.55}
.reacoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.rx{border:1px solid var(--linha);background:rgba(255,255,255,.03);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:14px;display:flex;gap:5px;align-items:center;transition:all .15s}
.rx span{font-family:var(--mono);font-size:11px;color:var(--tx2)}
.rx.minha{border-color:var(--neon);background:rgba(75,227,142,.12)}
.rx.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{50%{transform:scale(1.35)}}
.coment{margin-top:10px;padding-top:10px;border-top:1px solid var(--linha)}
.coment .c{display:flex;gap:8px;margin-bottom:8px;font-size:13px}
.coment .c .av{width:24px;height:24px;font-size:10px}
.coment .c div{background:rgba(255,255,255,.04);border-radius:10px;padding:6px 10px}
.compositor{display:flex;gap:10px;align-items:flex-start}
.compositor textarea{min-height:56px}

/* alertas coaching */
.at{border-left:4px solid var(--linha2);padding:9px 12px;margin-bottom:8px;background:rgba(255,255,255,.03);border-radius:0 10px 10px 0}
.at.atencao{border-color:var(--alerta)}.at.pendencia{border-color:var(--azul)}.at.destaque{border-color:var(--neon)}.at.sistema{border-color:var(--erro)}
.at b{display:block;font-size:13px}.at span{font-size:12px;color:var(--tx2)}
.at .quem{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3)}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.subnav button{background:rgba(255,255,255,.03);border:1px solid var(--linha);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;color:var(--tx2);font-size:12.5px;transition:all .2s}
.subnav button.ativo{background:var(--v500);color:#fff;border-color:transparent}
.legenda{font-size:12px;color:var(--tx2);line-height:1.6}

/* FAB + sheet */
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;border:0;border-radius:18px;padding:14px 20px;font-weight:800;font-size:15px;cursor:pointer;color:#05140C;
  background:linear-gradient(135deg,var(--neon),var(--menta));box-shadow:0 12px 30px rgba(75,227,142,.35),0 0 0 1px rgba(255,255,255,.2) inset;display:flex;align-items:center;gap:8px;transition:transform .2s}
.fab:hover{transform:translateY(-2px) scale(1.02)}
.fab b{font-size:20px;line-height:1}
.fundo{position:fixed;inset:0;background:rgba(2,8,5,.6);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--linha2);border-bottom:0;border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:10px 20px calc(22px + env(safe-area-inset-bottom));animation:sobe .35s cubic-bezier(.2,.8,.2,1)}
@media(min-width:700px){.fundo{align-items:center}.sheet{border-radius:22px;border-bottom:1px solid var(--linha2)}}
@keyframes sobe{from{transform:translateY(40px);opacity:0}}
.sheet .alca{width:44px;height:5px;border-radius:5px;background:var(--linha2);margin:4px auto 14px}
.sheet h3{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.04em;margin:0 0 14px}
.passo{margin-bottom:16px}
.passo .q{font-weight:700;font-size:13px;color:var(--tx2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}

/* login */
.login{max-width:420px;margin:0 auto;padding:40px 16px}
.login .hero{min-height:220px}
.login .hero::after{background:linear-gradient(180deg,rgba(6,18,12,.1),rgba(6,18,12,.92))}
.login .hero .conteudo{position:absolute;bottom:0}

/* toast + confete */
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card2);border:1px solid var(--linha2);color:var(--tx);padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:99;max-width:90vw;box-shadow:var(--sombra);animation:sobe .3s}
.toast.pts{border-color:var(--neon);color:var(--neon);font-family:var(--display);font-size:24px;letter-spacing:.05em}
.confete{position:fixed;top:-12px;width:9px;height:14px;z-index:98;pointer-events:none;border-radius:2px;animation:cai linear forwards}

.vazio{text-align:center;padding:30px 10px;color:var(--tx2)}

const iso = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addDias = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const fmtData = (s) => s ? new Date(s).toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—";
const fmtDia = (s) => s ? s.slice(0,10).split("-").reverse().slice(0,2).join("/") : "—";
const fmtSeg = (s) => s==null ? "—" : `${Math.floor(s/60)}m${String(Math.round(s%60)).padStart(2,"0")}s`;
const pct = (v) => v==null ? "—" : `${String(v).replace(".",",")}%`;
const n = (v) => (Number(v)||0).toLocaleString("pt-BR");
const diaSP = (ts) => ts ? iso(new Date(new Date(ts).toLocaleString("en-US",{timeZone:"America/Sao_Paulo"}))) : null;
const DOW = ["dom","seg","ter","qua","qui","sex","sáb"], MES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function haQuanto(ts){ const s=(Date.now()-new Date(ts))/1000; if(s<60) return "agora"; if(s<3600) return `${Math.floor(s/60)} min`; if(s<86400) return `${Math.floor(s/3600)} h`; return fmtData(ts); }
function toast(msg, ms=3000, cls=""){ const t=document.createElement("div"); t.className="toast "+cls; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
async function rpc(nome, args={}){ const {data,error}=await sb.rpc(nome,args); if(error){ toast(error.message); throw error; } return data; }
async function q(prom){ const {data,error}=await prom; if(error){ toast(error.message); throw error; } return data; }
const gestor = () => S.perfil?.papel === "gestor";
const sdrPor = (id) => S.sdrs.find(s=>s.id===id);
const nomeSdr = (id) => sdrPor(id)?.nome || "—";
const corSdr = (id) => sdrPor(id)?.cor || "#6FD39B";
const iniciais = (nome) => (nome||"?").split(/\s+/).slice(0,2).map(p=>p[0]).join("").toUpperCase();
const avatar = (nome, cor="#6FD39B", tam=32) => `<span class="av" style="background:${esc(cor)};width:${tam}px;height:${tam}px">${esc(iniciais(nome))}</span>`;

function contar(el, alvo, dur=900){
  const ini = Number(el.dataset.de||0); const t0 = performance.now();
  const passo = (t)=>{ const p=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-p,3); el.textContent = Math.round(ini+(alvo-ini)*e).toLocaleString("pt-BR"); if(p<1) requestAnimationFrame(passo); };
  requestAnimationFrame(passo);
}
function animarNumeros(root=document){ $$("[data-conta]", root).forEach(el=>contar(el, Number(el.dataset.conta))); }
function confete(qtd=70){
  const cores=["#4BE38E","#D4AF37","#F2D47A","#6FD39B","#FFFFFF","#1F8A5B"];
  for(let i=0;i<qtd;i++){ const c=document.createElement("i"); c.className="confete";
    c.style.left=Math.random()*100+"vw"; c.style.background=cores[i%cores.length];
    c.style.animationDuration=(1.6+Math.random()*1.8)+"s"; c.style.animationDelay=(Math.random()*.4)+"s"; c.style.transform=`rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c); setTimeout(()=>c.remove(), 4000); }
}
function sheet(html, onMount){
  const f=document.createElement("div"); f.className="fundo"; f.innerHTML=`<div class="sheet"><div class="alca"></div>${html}</div>`;
  const fechar=()=>{ f.remove(); };
  f.addEventListener("click", e=>{ if(e.target===f) fechar(); });
  document.body.appendChild(f); onMount && onMount(f, fechar); return f;
}
function chipsGrupo(root, nome, onChange){

// ================= PERÍODO =================
function periodo(tipo){
  const h = hojeSP(); let ini, fim = iso(h);
  if (tipo==="semana"){ ini = iso(addDias(h, -((h.getDay()+6)%7))); }
  else if (tipo==="semana_passada"){ const d=addDias(h, -((h.getDay()+6)%7)-7); ini=iso(d); fim=iso(addDias(d,6)); }
  else if (tipo==="mes"){ ini = iso(new Date(h.getFullYear(), h.getMonth(), 1)); }
  else if (tipo==="mes_passado"){ ini = iso(new Date(h.getFullYear(), h.getMonth()-1, 1)); fim = iso(new Date(h.getFullYear(), h.getMonth(), 0)); }
  else if (tipo==="total"){ ini = "2024-01-01"; }
  else if (tipo && tipo.startsWith("temp:")){ const t=S.temporadas.find(x=>x.id===tipo.slice(5)); if(t){ ini=t.inicio; fim=t.fim; } else return periodo("mes"); }
  else if (tipo==="custom"){ ini=S.ini; fim=S.fim; }
  else return periodo("semana");
  return { ini, fim };
}
function tempAtual(){ const h=iso(hojeSP()); return S.temporadas.find(t=>t.inicio<=h && t.fim>=h) || null; }
function seletorPeriodo(){
  const opts = [["semana","Esta semana"],["semana_passada","Semana passada"],["mes","Este mês"],["mes_passado","Mês passado"],["total","Total"],
    ...S.temporadas.map(t=>[`temp:${t.id}`, t.nome]), ["custom","Personalizado"]];
  const p = periodo(S.periodo);
  return `<div class="row" style="margin-bottom:14px">
    <select id="selPer" style="width:auto">${opts.map(([v,l])=>`<option value="${v}" ${S.periodo===v?"selected":""}>${esc(l)}</option>`).join("")}</select>
    <span class="${S.periodo==="custom"?"row":"oculto"}"><input type="date" id="pIni" value="${p.ini||""}" style="width:auto"><input type="date" id="pFim" value="${p.fim||""}" style="width:auto"></span>
    <span class="mono dim" style="font-size:12px">${fmtDia(p.ini)} → ${fmtDia(p.fim)}</span></div>`;
}
function ligarSeletor(){
  $("#selPer")?.addEventListener("change", e=>{ S.periodo=e.target.value; if(S.periodo==="custom"){ const p=periodo("semana"); S.ini=S.ini||p.ini; S.fim=S.fim||p.fim; } render(); });
  $("#pIni")?.addEventListener("change", e=>{ S.ini=e.target.value; render(); });
  $("#pFim")?.addEventListener("change", e=>{ S.fim=e.target.value; render(); });
}

// ================= AUTH =================
async function iniciar(){
  const { data:{ session } } = await sb.auth.getSession();
  S.user = session?.user || null;
  sb.auth.onAuthStateChange((ev, sess)=>{
    if(ev==="PASSWORD_RECOVERY"){ novaSenha(); return; }
    const mudou=(sess?.user?.id)!==(S.user?.id); S.user=sess?.user||null; if(mudou) carregar();
  });
  carregar();
}
async function carregar(){
  if(!S.user){ return telaLogin(); }
  const { data:perfil } = await sb.from("perfis").select("*").eq("user_id", S.user.id).maybeSingle();
  S.perfil = perfil;
  if(!perfil || perfil.papel==="pendente"){
    $("#app").innerHTML = `<div class="login"><div class="hero"><div class="flag"></div><div class="conteudo"><h1>QUASE <span>LÁ</span></h1></div></div>
      <div class="card entra"><h2>Acesso aguardando liberação</h2><p class="muted">Sua conta (${esc(S.user.email)}) foi criada. Peça ao gestor para cadastrar este e-mail no time.</p>
      <button class="btn sec" id="sair">Sair</button></div></div>`;
    $("#sair").onclick = ()=>sb.auth.signOut(); return;
  }
  S.sdrs = await q(sb.from("sdrs").select("*").order("nome"));
  S.temporadas = await q(sb.from("temporadas").select("*").order("inicio",{ascending:false}));
  if(!S.periodo){ const t=tempAtual(); S.periodo = t ? `temp:${t.id}` : "mes"; }
  ligarRealtime();
  render();
}
function telaLogin(){
  $("#app").innerHTML = `<div class="login">
    <div class="hero entra"><div class="flag"></div><div class="conteudo"><h1>NEXTERS <span>APP</span></h1><div class="meta">Os que mais fecham · Lux Energia</div></div></div>
    <div class="card entra" style="--i:2">
      <p class="muted" style="font-size:12.5px;margin:0 0 14px">Primeiro acesso? Digite seu e-mail e crie uma senha: a conta é criada na hora.</p>
      <label>E-mail<input id="lEmail" type="email" autocomplete="email"></label>
      <label>Senha (mínimo 6 caracteres)<input id="lSenha" type="password" autocomplete="current-password"></label>
      <button class="btn ouro" id="lOk" style="width:100%;padding:12px">Entrar em campo</button>
      <p style="margin:12px 0 0;text-align:center"><a href="#" id="lEsq" style="font-size:12px">Esqueci a senha</a></p></div></div>`;
  $("#lSenha").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#lOk").click(); });
  $("#lEsq").onclick = async (e)=>{ e.preventDefault(); const em=$("#lEmail").value.trim(); if(!em) return toast("Preencha o e-mail.");
    await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split("#")[0]}); toast("Se o e-mail existir, o link de redefinição foi enviado."); };
  $("#lOk").onclick = async ()=>{
    const email=$("#lEmail").value.trim().toLowerCase(), password=$("#lSenha").value;
    if(!email || password.length<6) return toast("Informe o e-mail e uma senha com pelo menos 6 caracteres.");
    const btn=$("#lOk"); btn.disabled=true; btn.textContent="Entrando…";
    try{
      const {error}=await sb.auth.signInWithPassword({email,password});
      if(!error) return;
      if(error.message!=="Invalid login credentials"){ toast(error.message); return; }
      const {data,error:e2}=await sb.auth.signUp({email,password});
      if(e2){ toast(/already|registered/i.test(e2.message)?"Senha incorreta.":e2.message); return; }
      if(data?.user && data.user.identities && data.user.identities.length===0){ toast("Senha incorreta."); return; }
      if(!data.session){ const r=await sb.auth.signInWithPassword({email,password}); if(r.error) toast(r.error.message); }
    } finally { if(document.body.contains(btn)){ btn.disabled=false; btn.textContent="Entrar em campo"; } }
  };

  sheet(`<h3>Nova senha</h3><label>Digite a nova senha<input id="ns" type="password"></label><button class="btn" id="nsOk" style="width:100%">Salvar</button>`,(el,fechar)=>{

let debounce;
function ligarRealtime(){
  if(S.canal) sb.removeChannel(S.canal);
  S.canal = sb.channel("nexters")
    .on("postgres_changes",{event:"*",schema:"public",table:"publicacoes"},()=>atualizarAoVivo("mural"))
    .on("postgres_changes",{event:"*",schema:"public",table:"reacoes"},()=>atualizarAoVivo("mural"))
    .on("postgres_changes",{event:"*",schema:"public",table:"comentarios"},()=>atualizarAoVivo("mural"))
    .on("postgres_changes",{event:"*",schema:"public",table:"reunioes"},()=>atualizarAoVivo("reunioes"))
    .subscribe();
}
function atualizarAoVivo(o){
  clearTimeout(debounce);
  debounce = setTimeout(()=>{
    if(document.querySelector(".fundo")) return; // não atrapalha quem está preenchendo
    if(o==="mural" && S.aba==="mural") telaMural(true);
    else if(o==="reunioes" && (S.aba==="reunioes"||S.aba==="inicio")) (S.aba==="reunioes"?telaReunioes:telaInicio)();
    else if(o==="mural") marcarNovidade();
  }, 400);
}
function marcarNovidade(){ const b=$('nav.abas [data-aba="mural"]'); if(b && !b.querySelector(".badge")) b.insertAdjacentHTML("beforeend",`<span class="badge">•</span>`); }

// ---------- status da leitura do GoTo ----------
function proximaLeitura(){
  const d = hojeSP(); const dow = d.getDay(); const min = d.getHours()*60 + d.getMinutes();
  const hhmm = (m)=>`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
  const util = dow>=1 && dow<=5;
  if(util && min < 8*60+2) return `hoje ${hhmm(8*60+2)}`;
  if(util && min < 19*60+2){ const h = min%60 < 2 ? Math.floor(min/60) : Math.floor(min/60)+1; return hhmm(h*60+2); }
  let k=1, nd=(dow+1)%7; while(nd===0||nd===6){ k++; nd=(nd+1)%7; }
  return `${k===1?"amanhã":DOW[nd]} 08:02`;
}
async function statusLeitura(){
  const el = $("#sync"); if(!el) return;
  let ult=null; try{ const {data}=await sb.rpc("ultima_leitura"); ult=data; }catch{}
  const quando = ult ? new Date(ult).toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo",hour:"2-digit",minute:"2-digit", ...((Date.now()-new Date(ult))>20*3600e3?{day:"2-digit",month:"2-digit"}:{})}) : "—";
  el.innerHTML = `<span class="txt">placar atualizado ${esc(quando)}<br>próxima ${esc(proximaLeitura())}</span><i class="live" title="Placar atualizado de hora em hora, seg a sex, 8h às 19h"></i>`;
}
setInterval(statusLeitura, 60000);

function anel(rot, v, meta, cor){
  const R=24, C=2*Math.PI*R, p = meta ? Math.min(1, v/meta) : 0;
  return `<div class="anel"><svg width="60" height="60" viewBox="0 0 60 60"><circle class="fundo" cx="30" cy="30" r="${R}" fill="none" stroke-width="7"/>
    <circle class="prog" cx="30" cy="30" r="${R}" fill="none" stroke="${p>=1?"#4BE38E":esc(cor)}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C*(1-p)}"/></svg>
    <div><div class="t">${rot}</div><div class="n">${n(v)}<span class="dim" style="font-size:14px"> / ${n(meta)}</span></div>${p>=1?`<span class="tag ok">meta batida</span>`:""}</div></div>`;
}
let relogioTimer;
function relogio(){
  clearInterval(relogioTimer);
  const tick=()=>{ const el=$("#contagem"); if(!el){ clearInterval(relogioTimer); return; }
    const fim=new Date(el.dataset.fim+"T23:59:59-03:00"); let s=Math.max(0,(fim-new Date())/1000);
    const d=Math.floor(s/86400); s-=d*86400; const h=Math.floor(s/3600); s-=h*3600; const m=Math.floor(s/60);
    el.innerHTML = `<div><b>${d}</b><small>dias</small></div><div><b>${h}</b><small>horas</small></div><div><b>${m}</b><small>min</small></div>`; };
  tick(); relogioTimer=setInterval(tick, 30000);
}

async function acaoReuniao(id, acao, v){
  const r = (await q(sb.from("reunioes").select("*").eq("id",id)))[0]; if(!r) return;
  if(acao==="status"){ const up={status:v}; if(v!=="realizada"){ up.qualidade=null; up.tipo_fechamento=null; } await q(sb.from("reunioes").update(up).eq("id",id));
    if(v==="realizada") toast("+10 pontos", 2000, "pts"); }
  else if(acao==="qual"){ await q(sb.from("reunioes").update({qualidade: r.qualidade===v?null:v}).eq("id",id)); }
  else if(acao==="fech"){ const novo = r.tipo_fechamento===v?null:v; await q(sb.from("reunioes").update({tipo_fechamento:novo}).eq("id",id));
    if(novo){ confete(140); toast(`FECHOU ${novo}! +${novo==="GD"?67:100}`, 3200, "pts"); } }
  else if(acao==="fatura"){ await q(sb.from("reunioes").update({fatura_recebida:!r.fatura_recebida}).eq("id",id)); }
  else if(acao==="apagar"){ if(!confirm(`Apagar a reunião de ${r.empresa}?`)) return; await q(sb.from("reunioes").delete().eq("id",id)); }
  else if(acao==="remarcar"){
    const h=hojeSP(); const dias=[]; for(let i=1; dias.length<6; i++){ const d=addDias(h,i); if(d.getDay()!==0) dias.push(d); }
    sheet(`<h3>Nova data · ${esc(r.empresa)}</h3><div class="chips">${dias.map(d=>`<span class="chip" data-g="nd" data-v="${iso(d)}">${diaChip(d)}</span>`).join("")}</div>
      <input type="date" id="nd" style="margin-top:10px"><button class="btn" id="ndOk" style="width:100%;margin-top:14px">Remarcar</button>`,(el,fechar)=>{
      let nd=null; chipsGrupo(el,"nd",x=>{ nd=x; $("#nd",el).value=x; }); $("#nd",el).onchange=e=>nd=e.target.value;
      $("#ndOk",el).onclick=async()=>{ if(!nd) return toast("Escolha a data."); await q(sb.from("reunioes").update({status:"remarcada", data_reuniao:new Date(nd+"T12:00:00-03:00").toISOString()}).eq("id",id)); fechar(); telaReunioes(); };
    });
    return;
  }
  telaReunioes();
}

function grafico(serie, campo){
  const dias = [...new Set(serie.map(s=>s.dia))].sort();
  if(!dias.length) return `<p class="dim">Sem dados.</p>`;
  const ids = [...new Set(serie.map(s=>s.sdr_id))];
  const max = Math.max(1, ...dias.map(d=>serie.filter(s=>s.dia===d).reduce((a,s)=>a+Number(s[campo]),0)));
  const W=560,H=180,pad=24, bw=(W-pad)/dias.length; let out="";
  dias.forEach((d,i)=>{ let y=H-pad;
    ids.forEach(id=>{ const v=Number(serie.find(s=>s.dia===d&&s.sdr_id===id)?.[campo]||0); const h=(H-pad-8)*v/max;
      if(h>0){ y-=h; out+=`<rect x="${pad+i*bw+2}" y="${H-pad}" height="0" data-y="${y}" data-h="${h}" width="${Math.max(2,bw-4)}" fill="${esc(corSdr(id))}" rx="3" style="transition:all .9s cubic-bezier(.2,.8,.2,1) ${i*25}ms"><title>${esc(nomeSdr(id))} · ${fmtDia(d)}: ${v}</title></rect>`; } });
    if(dias.length<=16 || i%Math.ceil(dias.length/12)===0) out+=`<text x="${pad+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${fmtDia(d)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"><text x="0" y="12">${max}</text><line x1="${pad}" x2="${W}" y1="${H-pad}" y2="${H-pad}" stroke="rgba(111,211,155,.2)"/>${out}</svg>
    <div class="row" style="gap:12px;margin-top:6px">${ids.map(id=>`<span class="row" style="gap:5px;font-size:12px"><i style="width:9px;height:9px;border-radius:3px;background:${esc(corSdr(id))}"></i>${esc(nomeSdr(id))}</span>`).join("")}</div>`;
}

// ================= ADMIN =================
async function telaAdmin(){
  const subs = [["coaching","Coaching"],["time","Time"],["metas","Metas"],["temporadas","Temporadas e prêmios"],["regras","Pontuação"],["ajustes","Bônus"],["goto","Atualização do placar"],["usuarios","Acessos"]];
  $("#conteudo").innerHTML = `<div class="subnav">${subs.map(([k,l])=>`<button data-sub="${k}" class="${S.subAdmin===k?"ativo":""}">${l}</button>`).join("")}</div><div id="adm"></div>`;
  $$(".subnav button").forEach(b=>b.onclick=()=>{ S.subAdmin=b.dataset.sub; telaAdmin(); });
  await ({coaching:admCoaching,time:admTime,metas:admMetas,temporadas:admTemporadas,regras:admRegras,ajustes:admAjustes,goto:admGoto,usuarios:admUsuarios}[S.subAdmin])();
}
async function admCoaching(){
  const at = await rpc("pontos_atencao");
  const ordem = {sistema:0,pendencia:1,atencao:2,destaque:3};
  at.sort((a,b)=>ordem[a.nivel]-ordem[b.nivel]);
  const rot = {sistema:"Sistema",pendencia:"Pendência sua",atencao:"Vale uma conversa",destaque:"Reconhecer"};
  $("#adm").innerHTML = `<div class="grid g2">
    <div class="card entra"><h2>Pontos de atenção</h2>
      <p class="sub">Visão da semana, sem olhar ligação por ligação. "Sem reunião" só aparece a partir da 2ª semana seguida sem marcar.</p>
      ${at.length ? at.map((a,i)=>`<div class="at ${a.nivel} entra" style="--i:${i}"><span class="quem">${rot[a.nivel]}${a.nome?" · "+esc(a.nome):""}</span><b>${esc(a.titulo)}</b><span>${esc(a.detalhe)}</span></div>`).join("")
        : `<div class="vazio"><b>Tudo em ordem</b>Nada pedindo atenção agora.</div>`}</div>
    <div class="card entra" style="--i:1"><h2>Recado rápido</h2><p class="sub">Publica no mural: para todo o time ou só para um SDR.</p>
      <textarea id="rcTxt" placeholder="Ex.: Thiago, abertura ficou muito boa hoje. Próximo passo: pedir a fatura já na primeira ligação."></textarea>
      <div class="chips" style="margin:10px 0"><span class="chip pq on" data-g="rc" data-v="">Para todos</span>${S.sdrs.filter(s=>s.ativo).map(s=>`<span class="chip pq" data-g="rc" data-v="${s.id}">Só ${esc(s.nome.split(" ")[0])}</span>`).join("")}</div>
      <button class="btn" id="rcOk">Publicar</button></div></div>`;
  let para=""; chipsGrupo($("#adm"),"rc",v=>para=v);
  $("#rcOk").onclick=async()=>{ const t=$("#rcTxt").value.trim(); if(!t) return; await q(sb.from("publicacoes").insert({texto:t, para_sdr_id:para||null})); toast("Publicado no mural."); $("#rcTxt").value=""; };
}
async function admTime(){
  const sdrs = await q(sb.from("sdrs").select("*").order("ativo",{ascending:false}).order("nome"));
  $("#adm").innerHTML = `<div class="card tbl entra"><div class="row" style="justify-content:space-between"><div><h2>Time</h2>
    <p class="sub">O e-mail libera o acesso do SDR. O ramal liga as ligações do GoTo a ele. A data de início define a 1ª semana (sem cobrança de reunião).</p></div><button class="btn" id="tNovo">+ Adicionar SDR</button></div>
    <table><thead><tr><th>Nome</th><th>E-mail</th><th>Ramal</th><th>Início</th><th>Cor</th><th>Ativo</th><th></th></tr></thead>
    <tbody>${sdrs.map(s=>`<tr>
      <td><input data-f="nome" value="${esc(s.nome)}"></td><td><input data-f="email" value="${esc(s.email)}" placeholder="email@…"></td>
      <td><input data-f="ramal" value="${esc(s.ramal)}" style="width:80px"></td>
      <td><input data-f="inicio" type="date" value="${s.inicio}"></td><td><input data-f="cor" type="color" value="${esc(s.cor)}" style="width:46px;padding:2px;height:34px"></td>
      <td><input data-f="ativo" type="checkbox" ${s.ativo?"checked":""} style="width:auto"></td>
      <td><button class="btn peq" data-salvar="${s.id}">Salvar</button></td></tr>`).join("")}</tbody></table></div>`;
  $("#tNovo").onclick = ()=> sheet(`<h3>Novo SDR</h3><label>Nome<input id="nsN"></label><label>E-mail<input id="nsE" type="email"></label><label>Ramal no GoTo<input id="nsR"></label><button class="btn" id="nsOk" style="width:100%">Adicionar</button>`,(el,fechar)=>{
    $("#nsOk",el).onclick=async()=>{ const nome=$("#nsN",el).value.trim(); if(!nome) return toast("Nome obrigatório.");
      await q(sb.from("sdrs").insert({nome, email:$("#nsE",el).value.trim()||null, ramal:$("#nsR",el).value.trim()||null, cor:["#6FD39B","#D4AF37","#4FC3F7","#FF8A65","#BA68C8"][S.sdrs.length%5]}));
      fechar(); await recarregarSdrs(); admTime(); };
  });
  $$("[data-salvar]").forEach(b=>b.onclick=async()=>{
    const tr=b.closest("tr"), row={}; tr.querySelectorAll("[data-f]").forEach(i=>{ row[i.dataset.f] = i.type==="checkbox" ? i.checked : (i.value.trim()||null); });
    if(!row.nome) return toast("Nome obrigatório."); if(row.email) row.email=row.email.toLowerCase();
    await q(sb.from("sdrs").update(row).eq("id",b.dataset.salvar)); await recarregarSdrs(); toast("Salvo.");
  });
}
async function recarregarSdrs(){ S.sdrs = await q(sb.from("sdrs").select("*").order("nome")); }
async function admMetas(){
  const metas = await q(sb.from("metas").select("*").order("vigente_desde",{ascending:false}));
  $("#adm").innerHTML = `<div class="grid g2"><div class="card entra"><h2>Nova meta semanal</h2>
    <p class="sub">Vale a partir da data escolhida. "Time todo" é a meta padrão; escolha um SDR para uma meta individual (ex.: rampa de novato).</p>
    <div class="form"><label>Para<select id="mSdr"><option value="">Time todo (padrão)</option>${S.sdrs.filter(s=>s.ativo).map(s=>`<option value="${s.id}">${esc(s.nome)}</option>`).join("")}</select></label>
    <label>Vigente desde<input type="date" id="mDesde" value="${periodo("semana").ini}"></label>
    <label>Ligações / semana<input type="number" id="mLig" value="250"></label><label>Reuniões / semana<input type="number" id="mReu" value="3"></label></div>
    <button class="btn" id="mOk">Salvar meta</button></div>
    <div class="card entra" style="--i:1"><h2>Rampa de novato</h2><p class="legenda">Semanas 1–2: 60% da meta cheia · semanas 3–4: 80% · a partir da 5ª: meta cheia. Quem está começando disputa de verdade desde o início.</p></div></div>
    <div class="card tbl entra" style="--i:2"><h2>Histórico de metas</h2><table><thead><tr><th>Para</th><th>Desde</th><th class="n">Ligações</th><th class="n">Reuniões</th><th></th></tr></thead>
    <tbody>${metas.map(m=>`<tr><td>${m.sdr_id?esc(nomeSdr(m.sdr_id)):"<b>Time todo</b>"}</td><td class="mono">${fmtDia(m.vigente_desde)}</td><td class="n">${m.ligacoes_semana}</td><td class="n">${m.reunioes_semana}</td>
    <td><button class="btn perigo peq" data-delm="${m.id}">Excluir</button></td></tr>`).join("")}</tbody></table></div>`;
  $("#mOk").onclick = async ()=>{ await q(sb.from("metas").insert({ sdr_id:$("#mSdr").value||null, vigente_desde:$("#mDesde").value, ligacoes_semana:+$("#mLig").value, reunioes_semana:+$("#mReu").value })); toast("Meta salva."); admMetas(); };
  $$("[data-delm]").forEach(a=>a.onclick=async()=>{ if(!confirm("Excluir meta?")) return; await q(sb.from("metas").delete().eq("id",a.dataset.delm)); admMetas(); });
}
async function admTemporadas(){
  const ts = await q(sb.from("temporadas").select("*").order("inicio",{ascending:false}));
  const campos = (t={})=>`<div class="form">
    <label>Nome<input data-t="nome" value="${esc(t.nome)}"></label><label>Início<input type="date" data-t="inicio" value="${t.inicio||""}"></label><label>Fim<input type="date" data-t="fim" value="${t.fim||""}"></label>
    <label>Prêmio 1º lugar<input data-t="premio_1" value="${esc(t.premio_1)}" placeholder="ex.: Escape 60 para 2"></label><label>Prêmio 2º<input data-t="premio_2" value="${esc(t.premio_2)}" placeholder="ex.: almoço"></label><label>Prêmio 3º<input data-t="premio_3" value="${esc(t.premio_3)}"></label></div>
    <label>Regras / observações (o time vê)<textarea data-t="regras">${esc(t.regras)}</textarea></label>`;
  const recarregarTemps = async()=>{ S.temporadas=await q(sb.from("temporadas").select("*").order("inicio",{ascending:false})); };
  $("#adm").innerHTML = `<div class="card entra"><h2>Nova temporada</h2><p class="sub">Um período de disputa com prêmio no fim: mensal, quinzenal ou um sprint.</p><div id="tNova">${campos()}</div><button class="btn" id="tCriar">Criar temporada</button></div>
    ${ts.map((t,i)=>`<div class="card entra" style="--i:${i+1}" data-tid="${t.id}"><h2>${esc(t.nome)}</h2>${campos(t)}<div class="row"><button class="btn" data-tsalvar>Salvar</button><button class="btn sec" data-tfech>Ver resultado</button><button class="btn perigo peq" data-tdel style="margin-left:auto">Excluir</button></div></div>`).join("")}`;
  const ler = (el)=>{ const o={}; el.querySelectorAll("[data-t]").forEach(i=>o[i.dataset.t]=i.value.trim()||null); return o; };
  $("#tCriar").onclick = async ()=>{ const o=ler($("#tNova")); if(!o.nome||!o.inicio||!o.fim) return toast("Nome, início e fim são obrigatórios."); await q(sb.from("temporadas").insert(o)); await recarregarTemps(); admTemporadas(); };
  $$("[data-tid]").forEach(c=>{ const id=c.dataset.tid;
    $("[data-tsalvar]",c).onclick=async()=>{ await q(sb.from("temporadas").update(ler(c)).eq("id",id)); await recarregarTemps(); toast("Salvo."); };
    $("[data-tdel]",c).onclick=async()=>{ if(!confirm("Excluir temporada?")) return; await q(sb.from("temporadas").delete().eq("id",id)); await recarregarTemps(); admTemporadas(); };
    $("[data-tfech]",c).onclick=async()=>{ const t=ts.find(x=>x.id===id); const r=await rpc("ranking",{p_inicio:t.inicio,p_fim:t.fim});
      sheet(`<h3>${esc(t.nome)} · resultado</h3><div class="placar">${r.map((x,i)=>`<div class="lugar p${i+1}"><div class="pos">${i+1}º</div>${avatar(x.nome,x.cor,36)}<div><div class="nome">${esc(x.nome)}</div><div class="dim" style="font-size:12px">${esc([t.premio_1,t.premio_2,t.premio_3][i]||"")}</div></div><div class="pts">${n(x.pontos)}<small>pontos</small></div></div>`).join("")}</div>`, ()=>confete(100)); };
  });
}
async function admRegras(){
  const [regras, pars] = await Promise.all([ q(sb.from("regras_pontos").select("*").order("ordem")), q(sb.from("parametros").select("*").eq("chave","ligacao_min_s")) ]);
  $("#adm").innerHTML = `<div class="grid g2"><div class="card tbl entra"><h2>Pontos por evento</h2><p class="sub">Mudanças valem para todo o histórico (o placar é recalculado na hora).</p>
    <table><thead><tr><th>Evento</th><th class="n">Pontos</th><th>Ativa</th></tr></thead><tbody>
    ${regras.map(r=>`<tr><td>${esc(r.descricao)}</td><td><input type="number" data-rp="${r.chave}" value="${r.pontos}" style="width:84px;text-align:right" class="mono"></td><td><input type="checkbox" data-ra="${r.chave}" ${r.ativa?"checked":""} style="width:auto"></td></tr>`).join("")}</tbody></table>
    <button class="btn" id="rOk" style="margin-top:12px">Salvar pontuação</button></div>
    <div class="card entra" style="--i:1"><h2>Critério de ligação</h2>
      ${pars.map(p=>`<label>${esc(p.descricao)}<input type="number" data-par="${p.chave}" value="${p.valor}"></label>`).join("")}
      <button class="btn" id="pOk">Salvar</button>
      <p class="legenda" style="margin-top:14px">Sem um mínimo, ligação de 2 segundos (caixa postal, número errado) vira ponto e o incentivo passa a ser discar sem parar. Com o piso, ligar muito continua valendo, mas reunião vale 20× e fechamento vale 67× a 100×.</p></div></div>`;
  $("#rOk").onclick = async ()=>{ for(const r of regras){ const p=+$(`[data-rp="${r.chave}"]`).value, a=$(`[data-ra="${r.chave}"]`).checked;
      if(p!==r.pontos||a!==r.ativa) await q(sb.from("regras_pontos").update({pontos:p,ativa:a}).eq("chave",r.chave)); } toast("Pontuação atualizada."); };
  $("#pOk").onclick = async ()=>{ for(const i of $$("[data-par]")) await q(sb.from("parametros").update({valor:+i.value}).eq("chave",i.dataset.par)); toast("Salvo."); };
}
async function admAjustes(){
  const aj = await q(sb.from("ajustes_pontos").select("*").order("data",{ascending:false}).limit(50));
  $("#adm").innerHTML = `<div class="grid g2"><div class="card entra"><h2>Bônus ou ajuste</h2><p class="sub">Para reconhecer algo fora das regras (ajudou um colega, trouxe indicação) ou corrigir um erro. O time vê o motivo.</p>
    <div class="chips" style="margin-bottom:12px">${S.sdrs.filter(s=>s.ativo).map((s,i)=>`<span class="chip ${i===0?"on":""}" data-g="aj" data-v="${s.id}">${esc(s.nome)}</span>`).join("")}</div>
    <div class="chips" style="margin-bottom:12px">${[5,10,20,50,-10].map((v,i)=>`<span class="chip pq ${i===1?"on":""} ${v<0?"nao":""}" data-g="ajp" data-v="${v}">${v>0?"+":""}${v}</span>`).join("")}</div>
    <label>Motivo<input id="aMot" placeholder="ex.: primeira fatura ACL na primeira semana"></label><button class="btn ouro" id="aOk">Lançar</button></div>
    <div class="card tbl entra" style="--i:1"><h2>Lançamentos</h2><table>${aj.map(a=>`<tr><td class="mono">${fmtDia(a.data)}</td><td>${esc(nomeSdr(a.sdr_id))}</td><td>${esc(a.motivo)}</td><td class="n" style="color:${a.pontos<0?"var(--erro)":"var(--neon)"}">${a.pontos>0?"+":""}${a.pontos}</td><td><button class="btn perigo peq" data-dela="${a.id}">×</button></td></tr>`).join("") || `<tr><td class="dim">Nenhum lançamento.</td></tr>`}</table></div></div>`;
  let sdr=S.sdrs.find(s=>s.ativo)?.id, pts=10; chipsGrupo($("#adm"),"aj",v=>sdr=v); chipsGrupo($("#adm"),"ajp",v=>pts=+v);
  $("#aOk").onclick = async ()=>{ const m=$("#aMot").value.trim(); if(!m) return toast("Informe o motivo."); await q(sb.from("ajustes_pontos").insert({sdr_id:sdr,pontos:pts,data:iso(hojeSP()),motivo:m})); if(pts>0) confete(50); toast("Lançado."); admAjustes(); };
  $$("[data-dela]").forEach(a=>a.onclick=async()=>{ await q(sb.from("ajustes_pontos").delete().eq("id",a.dataset.dela)); admAjustes(); });
}
async function admGoto(){
  const logs = await q(sb.from("sync_log").select("*").order("id",{ascending:false}).limit(15));
  const ult = logs.find(l=>!l.erro);
  $("#adm").innerHTML = `<div class="grid g2"><div class="card entra"><h2>Atualização do placar</h2>
    <p class="sub">De hora em hora (08:02 às 19:02), de segunda a sexta, o placar puxa do GoTo o total de ligações de cada um e soma os pontos.</p>
    ${ult?`<div class="at destaque"><b>Última atualização: ${fmtData(ult.iniciado_em)}</b><span>${n(ult.gravadas)} ligações novas no placar</span></div>`:`<div class="at">Nenhuma atualização ainda.</div>`}
    <p class="legenda">Para funcionar: computador ligado, Chrome aberto e logado no GoTo. Se falhar, chega um e-mail de alerta.</p></div>
    <div class="card tbl entra" style="--i:1"><h2>Histórico</h2><table><thead><tr><th>Quando</th><th class="n">Novas</th><th>Erro</th></tr></thead>
      <tbody>${logs.map(l=>`<tr><td class="mono">${fmtData(l.iniciado_em)}</td><td class="n">${l.gravadas??"—"}</td><td style="color:var(--erro);font-size:12px">${esc(l.erro||"")}</td></tr>`).join("") || `<tr><td colspan="3" class="dim">Nenhuma atualização ainda.</td></tr>`}</tbody></table></div></div>`;
}
async function admUsuarios(){
  const us = await rpc("usuarios");
  $("#adm").innerHTML = `<div class="card tbl entra"><h2>Acessos</h2><p class="sub">Quem criou conta. SDRs são liberados automaticamente quando o e-mail está cadastrado em Time.</p>
    <table><thead><tr><th>E-mail</th><th>Papel</th><th>SDR vinculado</th><th></th></tr></thead><tbody>
    ${us.map(u=>`<tr><td>${esc(u.email)}</td><td><select data-pap="${u.user_id}" ${u.user_id===S.user.id?"disabled":""}>${["gestor","sdr","pendente"].map(p=>`<option ${u.papel===p?"selected":""}>${p}</option>`).join("")}</select></td>
      <td><select data-us="${u.user_id}"><option value="">—</option>${S.sdrs.map(s=>`<option value="${s.id}" ${u.sdr_id===s.id?"selected":""}>${esc(s.nome)}</option>`).join("")}</select></td>
      <td><button class="btn peq" data-usok="${u.user_id}">Salvar</button></td></tr>`).join("")}</tbody></table></div>`;
  $$("[data-usok]").forEach(b=>b.onclick=async()=>{ const id=b.dataset.usok;
    const up={ sdr_id: $(`[data-us="${id}"]`).value||null }; const pap=$(`[data-pap="${id}"]`); if(!pap.disabled) up.papel=pap.value;
    await q(sb.from("perfis").update(up).eq("user_id",id)); toast("Salvo."); });
}

iniciar();
</script>
